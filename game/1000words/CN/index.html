<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>汉字达人 Pro - 全量字库图形版</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        :root {
            --primary-color: #4CAF50;
            --bg-color: #f5f7fa;
            --accent-highlight: #337ab7;
            --accent-red: #e74c3c;
            --correct-green: #4CAF50;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg-color); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        #app-container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        
        /* 目录选择器 */
        #data-selector { background: #e8f5e9; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .select-group { display: flex; gap: 10px; margin-bottom: 10px; }
        select { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; }
        
        .load-btn { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #status-msg { font-size: 0.85rem; margin-top: 8px; color: #666; }

        /* 菜单按钮 */
        .menu-btn { display: block; width: 100%; padding: 16px; margin: 10px 0; background: var(--primary-color); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #388E3C; }
        .menu-btn:disabled { background: #ccc; box-shadow: 0 4px 0 #aaa; cursor: not-allowed; }

        /* 游戏区 */
        #game-area { display: none; }
        #question-title { font-size: 1.1rem; margin-bottom: 10px; font-weight: 600; color: #555; }
        #hanzi-target { width: 220px; height: 220px; margin: 0 auto 15px; border: 1px solid #eee; background: white; position: relative; }
        
        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .option-btn { padding: 10px; background: #f8f9fa; border: 2px solid #eee; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; min-height: 80px; }
        .back-btn { background: #90a4ae; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

<div id="app-container">
    <h1>🎒 汉字达人 Pro</h1>
    
    <div id="main-menu">
        <div id="data-selector">
            <div class="select-group">
                <select id="user-group" onchange="updateSubCategory()">
                    <option value="student">小学生 (同步年级)</option>
                    <option value="adult">大朋友 (分类库)</option>
                </select>
                <select id="sub-category"></select>
            </div>
            <button class="load-btn" onclick="fetchWordList()">开始加载字库</button>
            <div id="status-msg">请选择分类并点击加载</div>
        </div>

        <button class="menu-btn game-btn" disabled onclick="startGame(1)">1. 看汉字 · 选拼音</button>
        <button class="menu-btn game-btn" disabled onclick="startGame(2)">2. 听拼音 · 选汉字</button>
        <button class="menu-btn game-btn" disabled onclick="startGame(3)">3. 辨笔画 · 识形状</button>
        <button class="menu-btn game-btn" disabled onclick="startGame(4)">4. 描红模式 (练习)</button>
        <button class="menu-btn game-btn" disabled onclick="startGame(5)">5. 默写模式 (盲写)</button>
    </div>

    <div id="game-area">
        <div id="question-title"></div>
        <div id="hanzi-target"></div>
        <div id="options-area" class="option-grid"></div>
        <button class="back-btn" onclick="returnToMenu()">返回菜单</button>
    </div>
</div>

<script>
    // --- 静态配置 ---
    const CONFIG = {
        student: { folder: 'hanzi_by_grade', data: [{ name: "一年级上册", count: 101 }, { name: "一年级下册", count: 274 }, 
{ name: "二年级上册", count: 424 },{ name: "二年级下册", count: 430 },
{ name: "三年级上册", count: 325 },{ name: "三年级下册", count: 319 }, 
{ name: "四年级上册", count: 211 },{ name: "四年级下册", count: 199 },
{ name: "五年级上册", count: 138 },{ name: "五年级下册", count: 122 },
{ name: "六年级上册", count: 120 },{ name: "六年级下册", count: 80}] },
        adult: { folder: 'hanzi_types', data: [{ name: "常用字", count: 2491 }, { name: "次常用字", count: 997 }, { name: "通用字", count: 383 }, { name: "生僻字", count: 16952 }] }
    };

    let activeWordList = [], shuffledQueue = [], currentWord = null, currentMode = 0, currentWriter = null, currentStrokeIdx = -1;

    function updateSubCategory() {
        const group = document.getElementById('user-group').value;
        const subSelect = document.getElementById('sub-category');
        subSelect.innerHTML = '';
        CONFIG[group].data.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.name;
            opt.innerText = `${item.name} (${item.count}字)`;
            subSelect.appendChild(opt);
        });
    }

    async function fetchWordList() {
        const group = document.getElementById('user-group').value;
        const sub = document.getElementById('sub-category').value;
        const status = document.getElementById('status-msg');
        status.innerText = "⏳ 正在载入...";
        try {
            const response = await fetch(`./${CONFIG[group].folder}/${sub}.json`);
            activeWordList = await response.json();
            shuffledQueue = [...activeWordList].sort(() => Math.random() - 0.5);
            document.querySelectorAll('.game-btn').forEach(b => b.disabled = false);
            status.innerText = `✅ [${sub}] 加载成功`;
        } catch (e) {
            status.innerText = "❌ 文件加载失败";
        }
    }

    function startGame(mode) {
        currentMode = mode;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        refreshGame();
    }

    async function refreshGame() {
        if (currentWriter) currentWriter.destroy();
        document.getElementById('hanzi-target').innerHTML = '';
        document.getElementById('options-area').innerHTML = '';
        
        if (shuffledQueue.length === 0) shuffledQueue = [...activeWordList].sort(() => Math.random() - 0.5);
        currentWord = shuffledQueue.pop();

        // 核心：静默加载当前字的笔顺 JSON 数据
        try {
            const res = await fetch(`./data/strokes/${currentWord.char}.json`);
            currentWord.strokeData = await res.json();
            runModeLogic();
        } catch (e) {
            console.error("缺少笔画文件:", currentWord.char);
            refreshGame(); // 跳过这个字
        }
    }

    function runModeLogic() {
        const target = document.getElementById('hanzi-target');
        const title = document.getElementById('question-title');

        if (currentMode === 1) {
            title.innerText = "这个字的拼音是？";
            target.innerText = currentWord.char;
            target.style.fontSize = "120px";
            target.style.lineHeight = "220px";
            renderTextOptions('py', currentWord.py);
        } else if (currentMode === 2) {
            title.innerText = `点击拼音 [ ${currentWord.py} ] 对应的字`;
            target.innerText = "？";
            target.style.fontSize = "120px";
            renderTextOptions('char', currentWord.char);
        } else if (currentMode === 3) {
            playVisualStrokeMode();
        } else {
            playWritingMode();
        }
    }

    // --- 模式3：图形辨笔画 ---
    function playVisualStrokeMode() {
        const area = document.getElementById('options-area');
        const strokes = currentWord.strokeData.strokes;
        currentStrokeIdx = Math.floor(Math.random() * strokes.length);
        const correctPath = strokes[currentStrokeIdx];

        document.getElementById('question-title').innerText = `请选出 "${currentWord.char}" 的第 ${currentStrokeIdx + 1} 笔：`;

        initWriter(currentWord.char, { strokeColor: '#ddd', showCharacter: false });
        setTimeout(() => {
            currentWriter.updateColor('strokeColor', 'var(--accent-highlight)', { strokeNum: currentStrokeIdx });
            currentWriter.animateStroke(currentStrokeIdx);
        }, 200);

        // 准备选项：1个正确，3个干扰
        let options = [{ path: correctPath, isCorrect: true }];
        while (options.length < 4) {
            // 从当前字的其他笔画或随机字里抓笔画
            let randCharObj = activeWordList[Math.floor(Math.random() * activeWordList.length)];
            // 简单的随机干扰路径（如果是生产环境，建议预存一组常用笔画路径）
            let randPath = strokes[Math.floor(Math.random() * strokes.length)]; 
            if (!options.find(o => o.path === randPath)) {
                options.push({ path: randPath, isCorrect: false });
            }
        }

        options.sort(() => Math.random() - 0.5).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            // 使用 SVG 渲染笔画，注意坐标缩放和翻转
            btn.innerHTML = `
                <svg viewBox="0 0 1024 1024" width="60" height="60">
                    <g transform="scale(1, -1) translate(0, -900)">
                        <path d="${opt.path}" fill="#333" />
                    </g>
                </svg>`;
            btn.onclick = () => {
                if (opt.isCorrect) {
                    btn.style.borderColor = 'var(--correct-green)';
                    btn.style.background = '#e8f5e9';
                    setTimeout(refreshGame, 800);
                } else {
                    btn.style.borderColor = 'var(--accent-red)';
                    currentWriter.animateStroke(currentStrokeIdx);
                }
            };
            area.appendChild(btn);
        });
    }

    function playWritingMode() {
        const isQuiz = currentMode === 5;
        document.getElementById('question-title').innerText = isQuiz ? `默写拼音：${currentWord.py}` : `描红：${currentWord.char}`;
        initWriter(currentWord.char, { showOutline: !isQuiz, showCharacter: false });
        currentWriter.quiz({ onComplete: () => setTimeout(refreshGame, 800) });
    }

    function renderTextOptions(key, correctValue) {
        const area = document.getElementById('options-area');
        let options = [correctValue];
        while(options.length < 4) {
            let r = activeWordList[Math.floor(Math.random() * activeWordList.length)][key];
            if(!options.includes(r)) options.push(r);
        }
        options.sort(() => Math.random() - 0.5).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.style.fontSize = "1.2rem";
            btn.onclick = () => {
                if(opt === correctValue) {
                    btn.style.background = 'var(--correct-green)'; btn.style.color='white';
                    setTimeout(refreshGame, 800);
                } else {
                    btn.style.background = 'var(--accent-red)'; btn.style.color='white';
                }
            };
            area.appendChild(btn);
        });
    }

    function initWriter(char, config) {
        currentWriter = HanziWriter.create('hanzi-target', char, {
            width: 200, height: 200, padding: 10,
            showHintAfterMisses: 1,
            charDataLoader: (char, onComplete) => onComplete(currentWord.strokeData),
            ...config
        });
    }

    function returnToMenu() {
        document.getElementById('main-menu').style.display = 'block';
        document.getElementById('game-area').style.display = 'none';
        if (currentWriter) currentWriter.destroy();
    }

    window.onload = updateSubCategory;
</script>
</body>
</html>
