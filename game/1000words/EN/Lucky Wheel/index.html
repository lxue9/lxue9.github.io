<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Quest</title>
    <script src="../../vocabulary.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a12;
            --vegas-gold: #ffcc00;
            --neon-red: #ff003c;
            --neon-green: #2ecc71;
            --bulb-off: #443300;
            --metal-gloss: linear-gradient(135deg, #222 0%, #000 50%, #111 100%);
            --btn-bg: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at center, #1e1e30 0%, var(--bg-dark) 100%);
            height: 100vh; height: -webkit-fill-available;
            overflow: hidden; display: flex; flex-direction: column;
        }

        header {
            text-align: center; padding: 10px 0; color: white;
            text-shadow: 0 0 10px var(--neon-red);
            font-family: 'Monoton', cursive; font-size: clamp(24px, 8vw, 34px);
        }

        /* --- 拉斯维加斯灯牌 --- */
        .vegas-sign {
            align-self: center; background: #111; padding: 12px 35px; border-radius: 12px;
            border: 2px solid #444; position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 204, 0, 0.1);
            margin-bottom: 15px; display: flex; flex-direction: column; align-items: center;
        }
        .bulbs-row { position: absolute; display: flex; justify-content: space-around; width: 92%; }
        .bulbs-top { top: 4px; } .bulbs-bottom { bottom: 4px; }
        .bulb { width: 6px; height: 6px; background: var(--bulb-off); border-radius: 50%; }
        .bulb:nth-child(odd) { animation: flash-1 0.6s infinite alternate; }
        .bulb:nth-child(even) { animation: flash-2 0.6s infinite alternate-reverse; }
        @keyframes flash-1 { from { background: var(--bulb-off); } to { background: #fff; box-shadow: 0 0 8px var(--vegas-gold); } }
        @keyframes flash-2 { from { background: #fff; box-shadow: 0 0 8px var(--vegas-gold); } to { background: var(--bulb-off); } }
        
        .vegas-label { color: var(--vegas-gold); font-size: 11px; font-weight: bold; letter-spacing: 1px; }
        .vegas-number {
            color: #fff; font-family: 'Orbitron', sans-serif; font-size: 36px;
            text-shadow: 0 0 15px var(--neon-green);
        }

        /* --- 转盘区 --- */
        #menu-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .wheel-section { 
            position: relative; width: min(82vw, 380px); aspect-ratio: 1/1;
            background: var(--metal-gloss); padding: 8px; border-radius: 50%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .wheel-container { width: 100%; height: 100%; border: 4px solid #111; border-radius: 50%; overflow: hidden; position: relative; }
        #wheel { width: 100%; height: 100%; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        .spin-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 75px; height: 75px; background: #000; border-radius: 50%; 
            border: 2px solid var(--neon-red); z-index: 40; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 22px; color: #fff; cursor: pointer; font-family: 'Fredoka One';
            box-shadow: 0 0 20px var(--neon-red), inset 0 0 10px var(--neon-red);
            animation: breathe 2s infinite;
        }
        @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; box-shadow: 0 0 30px var(--neon-red); } }

        /* --- 闪卡页面适配 --- */
        #game-screen { display: none; flex: 1; flex-direction: column; background: var(--bg-dark); }
        #card-container { flex: 1; display: flex; align-items: center; justify-content: center; perspective: 1500px; padding: 20px; }
        
        .card-wrapper { 
            width: 100%; max-width: 320px; height: 80%; max-height: 480px;
            position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        /* 翻面状态类 */
        .card-wrapper.is-flipped { transform: rotateY(180deg); }

        .card-face { 
            position: absolute; width: 100%; height: 100%; background: #fff; border-radius: 25px; 
            backface-visibility: hidden; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .card-front { border: 4px solid #444; }
        .card-back { border: 4px solid var(--vegas-gold); transform: rotateY(180deg); }

        /* --- 美化后的底部按钮 (无黑边) --- */
        #footer-ui { 
            height: 120px; width: 100%; display: flex; justify-content: center; gap: 50px;
            align-items: center; padding-bottom: env(safe-area-inset-bottom);
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        }
        .collection-btn { 
            width: 75px; height: 75px; background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; position: relative;
            backdrop-filter: blur(5px); transition: 0.3s;
        }
        /* 红外发光风格按钮 */
        .collection-btn.btn-unknown { box-shadow: 0 0 15px var(--neon-red); }
        .collection-btn.btn-known { box-shadow: 0 0 15px var(--vegas-gold); }
        
        .badge { 
            position: absolute; top: -5px; right: -5px; background: #fff; color: #000; 
            min-width: 22px; height: 22px; border-radius: 11px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 12px; font-weight: 900; 
        }

        #level-preview { 
            position: absolute; top: 12%; width: 260px; background: white; 
            border-radius: 20px; padding: 20px; text-align: center; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); opacity: 0; transform: scale(0.8); 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100;
        }
        #level-preview.show { opacity: 1; transform: scale(1); pointer-events: auto; }
    </style>
</head>
<body>

    <header>WORD QUEST</header>

    <div class="vegas-sign">
        <div class="bulbs-row bulbs-top" id="bulbs-t"></div>
        <div class="vegas-label">MASTERED</div>
        <div class="vegas-number" id="total-known-count">000</div>
        <div class="bulbs-row bulbs-bottom" id="bulbs-b"></div>
    </div>

    <div id="menu-screen">
        <div id="level-preview" onclick="enterSelectedLevel()">
            <div style="font-size: 45px;" id="pre-emoji">🧒</div>
            <div id="pre-name" style="font-size: 20px; font-weight:900; color:#333; margin:5px 0;">JACKPOT!</div>
            <div id="pre-progress" style="font-family:'Orbitron'; color:var(--neon-green);">0/100</div>
            <div style="color:var(--neon-red); font-size:12px; margin-top:10px; font-weight:bold;">TAP TO START</div>
        </div>

        <div class="wheel-section">
            <div class="wheel-container">
                <canvas id="wheel"></canvas>
            </div>
            <div class="spin-btn" onclick="spinWheel()">SPIN</div>
        </div>
    </div>

    <div id="game-screen">
        <button onclick="exitGame()" style="position:absolute; top:15px; left:15px; z-index:200; padding:10px 20px; border-radius:25px; background:rgba(255,255,255,0.1); color:#fff; border:1px solid rgba(255,255,255,0.3); backdrop-filter:blur(5px);">🏠 EXIT</button>
        <div id="card-container"></div>
        <div id="footer-ui">
            <div class="collection-btn btn-unknown" onclick="startReview('unknown')"><span style="font-size:30px;">🎒</span><div class="badge" id="count-unknown">0</div></div>
            <div class="collection-btn btn-known" onclick="startReview('known')"><span style="font-size:30px;">⭐</span><div class="badge" id="count-known">0</div></div>
        </div>
    </div>

    <script>
        function createBulbs() {
            const t = document.getElementById('bulbs-t'), b = document.getElementById('bulbs-b');
            for(let i=0; i<8; i++) { t.innerHTML += '<div class="bulb"></div>'; b.innerHTML += '<div class="bulb"></div>'; }
        }
        createBulbs();

        let levelKeys = Object.keys(DB);
        let currentRotation = 0, isSpinning = false, selectedLevelId = null;

        function updateGlobalTotal() {
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('progress_')) {
                    const data = JSON.parse(localStorage.getItem(key));
                    if (data?.known) total += data.known.length;
                }
            }
            document.getElementById('total-known-count').innerText = total.toString().padStart(3, '0');
        }

        function drawWheel() {
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const size = 800; canvas.width = size; canvas.height = size;
            const arc = (2 * Math.PI) / levelKeys.length;
            const colors = ["#1a1a1a", "#262626", "#0f0f0f", "#333333", "#111111"];
            ctx.translate(size/2, size/2);
            levelKeys.forEach((key, i) => {
                const angle = i * arc - Math.PI/2;
                ctx.beginPath(); ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(0, 0); ctx.arc(0, 0, size/2, angle, angle + arc); ctx.fill();
                ctx.strokeStyle = "rgba(255,204,0,0.2)"; ctx.lineWidth = 2; ctx.stroke();
                ctx.save(); ctx.rotate(angle + arc/2);
                ctx.font = "80px Apple Color Emoji, Segoe UI Emoji"; ctx.textAlign = "center";
                ctx.fillText(DB[key].levelEmoji, size/2 * 0.7, 25); ctx.restore();
            });
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('level-preview').classList.remove('show');
            currentRotation += 1800 + Math.floor(Math.random() * 360);
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;
            setTimeout(() => {
                isSpinning = false;
                const deg = (360 - (currentRotation % 360)) % 360;
                selectedLevelId = levelKeys[Math.floor(deg / (360/levelKeys.length)) % levelKeys.length];
                showPreview(selectedLevelId);
            }, 4000);
        }

        function showPreview(id) {
            const level = DB[id], prog = JSON.parse(localStorage.getItem(`progress_${id}`)) || {index: 0};
            document.getElementById('pre-emoji').innerText = level.levelEmoji;
            document.getElementById('pre-name').innerText = level.levelName.split(': ')[1];
            document.getElementById('pre-progress').innerText = `${prog.index}/${Object.keys(level.words).length}`;
            document.getElementById('level-preview').classList.add('show');
        }

        // --- 闪卡翻面逻辑修复 ---
        let levelData = [], currentIndex = 0, listUnknown = [], listKnown = [], currentLevelId = null;

        function startGame(id) {
            currentLevelId = id;
            const wordsObj = DB[id].words;
            levelData = Object.keys(wordsObj).map(key => ({ en: key, emoji: wordsObj[key][0], cn: wordsObj[key][1], py: wordsObj[key][4] }));
            const saved = JSON.parse(localStorage.getItem(`progress_${id}`)) || {index:0, unknown:[], known:[]};
            currentIndex = saved.index; listUnknown = saved.unknown; listKnown = saved.known;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            renderNextCard(); updateCounters();
        }

        function renderNextCard() {
            const container = document.getElementById('card-container');
            container.innerHTML = '';
            if (currentIndex >= levelData.length) { 
                container.innerHTML = '<div style="color:white; font-size:30px; font-family:Monoton;">JACKPOT! 🏆</div>'; 
                return; 
            }
            const word = levelData[currentIndex];
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.innerHTML = `
                <div class="card-face card-front"><div style="font-size:48px; font-family:'Fredoka One'; color:#333;">${word.en}</div></div>
                <div class="card-face card-back"><div style="font-size:70px;">${word.emoji}</div><div style="font-size:32px; font-weight:900; color:#333; margin:10px 0;">${word.cn}</div><div style="color:#888;">${word.py}</div></div>`;
            
            container.appendChild(wrapper);
            speak(word.en, 'en-US');
            
            // 绑定交互逻辑
            initCardInteraction(wrapper, word);
        }

        function initCardInteraction(el, word) {
            let startX = 0, currentX = 0, startTime = 0, isDragging = false;

            const onStart = (e) => {
                startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
                startTime = Date.now();
                isDragging = false;
                el.style.transition = 'none';
            };

            const onMove = (e) => {
                if (startTime === 0) return;
                let x = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
                currentX = x - startX;
                if (Math.abs(currentX) > 10) {
                    isDragging = true;
                    // 拖拽时保持当前的旋转状态
                    let rotation = el.classList.contains('is-flipped') ? 180 : 0;
                    el.style.transform = `translateX(${currentX}px) rotateY(${rotation}deg) rotateZ(${currentX * 0.05}deg)`;
                }
            };

            const onEnd = () => {
                if (startTime === 0) return;
                el.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                
                if (!isDragging && (Date.now() - startTime < 250)) {
                    // 点击翻面
                    el.classList.toggle('is-flipped');
                    if (el.classList.contains('is-flipped')) speak(word.cn, 'zh-CN');
                } else if (currentX > 120) {
                    swipeAction('known', word);
                } else if (currentX < -120) {
                    swipeAction('unknown', word);
                } else {
                    // 回弹
                    let rotation = el.classList.contains('is-flipped') ? 180 : 0;
                    el.style.transform = `rotateY(${rotation}deg)`;
                }
                startTime = 0; currentX = 0;
            };

            el.addEventListener('mousedown', onStart); el.addEventListener('touchstart', onStart);
            window.addEventListener('mousemove', onMove); window.addEventListener('touchmove', onMove);
            window.addEventListener('mouseup', onEnd); window.addEventListener('touchend', onEnd);
        }

        function swipeAction(type, word) {
            if (type === 'known') { listKnown.push(word); listUnknown = listUnknown.filter(i => i.en !== word.en); }
            else { listUnknown.push(word); }
            currentIndex++;
            localStorage.setItem(`progress_${currentLevelId}`, JSON.stringify({ index: currentIndex, unknown: listUnknown, known: listKnown }));
            updateCounters(); 
            setTimeout(renderNextCard, 200);
            updateGlobalTotal();
        }

        function enterSelectedLevel() { if (selectedLevelId) startGame(selectedLevelId); }
        function updateCounters() { document.getElementById('count-unknown').innerText = listUnknown.length; document.getElementById('count-known').innerText = listKnown.length; }
        function exitGame() { document.getElementById('game-screen').style.display = 'none'; document.getElementById('menu-screen').style.display = 'flex'; updateGlobalTotal(); }
        function speak(t, l) { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = l; window.speechSynthesis.speak(m); }
        
        window.onload = () => { drawWheel(); updateGlobalTotal(); };
    </script>
</body>
</html>
