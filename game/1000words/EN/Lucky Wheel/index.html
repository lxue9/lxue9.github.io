<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>单词大冒险 - 霓虹灯牌回归版</title>
    <script src="../../vocabulary.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a12;
            --vegas-gold: #ffcc00;
            --neon-red: #ff003c;
            --neon-green: #2ecc71;
            --bulb-off: #443300;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at center, #1e1e30 0%, var(--bg-dark) 100%);
            height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
        }

        header {
            text-align: center; padding: 8px 0; color: white;
            text-shadow: 0 0 10px var(--neon-red);
            font-family: 'Monoton', cursive; font-size: clamp(18px, 5vw, 26px);
            flex-shrink: 0;
        }

        /* --- 核心修复：拉斯维加斯三段式灯牌 --- */
        .vegas-sign {
            align-self: center; background: #111; padding: 12px 35px; border-radius: 15px;
            border: 2px solid #333; position: relative; margin-bottom: 5px;
            display: flex; flex-direction: column; align-items: center; 
            box-shadow: 0 5px 25px rgba(0,0,0,0.7); flex-shrink: 0;
        }
        .bulbs-row { position: absolute; display: flex; justify-content: space-around; width: 94%; left: 3%; }
        .bulbs-top { top: 5px; } .bulbs-bottom { bottom: 5px; }
        .bulb { width: 4px; height: 4px; background: var(--bulb-off); border-radius: 50%; }
        .bulb:nth-child(odd) { animation: flash-1 0.6s infinite alternate; }
        .bulb:nth-child(even) { animation: flash-2 0.6s infinite alternate-reverse; }
        
        @keyframes flash-1 { from { background: var(--bulb-off); } to { background: #fff; box-shadow: 0 0 8px var(--vegas-gold); } }
        @keyframes flash-2 { from { background: #fff; box-shadow: 0 0 8px var(--vegas-gold); } to { background: var(--bulb-off); } }
        
        .vegas-label { 
            color: var(--vegas-gold); font-size: 10px; font-weight: 900; 
            letter-spacing: 2px; text-transform: uppercase; line-height: 1.2;
        }
        .vegas-number { 
            color: #fff; font-family: 'Orbitron', sans-serif; font-size: 34px; 
            text-shadow: 0 0 15px var(--neon-green); margin: 2px 0; line-height: 1;
        }

        /* --- 容器 --- */
        #menu-screen, #game-screen { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; }
        #game-screen { display: none; background: var(--bg-dark); }

        /* --- 预览框 --- */
        #level-preview { 
            position: absolute; top: 5%; width: 260px; background: white; 
            border-radius: 20px; padding: 15px; text-align: center; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.8); opacity: 0; transform: scale(0.5); 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1500; pointer-events: none;
        }
        #level-preview.show { opacity: 1; transform: scale(1); pointer-events: auto; }

        /* --- 转盘 --- */
        .wheel-section { 
            margin-top: 110px; position: relative; width: min(80vw, 340px); aspect-ratio: 1/1;
            background: #000; padding: 5px; border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #wheel { width: 100%; height: 100%; transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); border-radius: 50%; }
        .spin-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 60px; height: 60px; background: #000; border-radius: 50%; 
            border: 2px solid var(--neon-red); z-index: 100; color: #fff;
            display: flex; align-items: center; justify-content: center; font-family: 'Fredoka One';
            box-shadow: 0 0 15px var(--neon-red); font-size: 16px;
        }

        /* --- 闪卡 --- */
        #card-container { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; perspective: 2000px; padding: 15px; margin-bottom: 100px; }
        .card-wrapper { width: min(85vw, 360px); aspect-ratio: 1/1; position: relative; transform-style: preserve-3d; transition: transform 0.5s; }
        .card-wrapper.is-flipped { transform: rotateY(180deg); }
        .card-face { 
            position: absolute; width: 100%; height: 100%; background: #fff; border-radius: 30px; 
            backface-visibility: hidden; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 25px;
            border: 6px solid #333; box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        .card-back { transform: rotateY(180deg); border-color: var(--vegas-gold); }

        /* --- 底部按钮 --- */
        #footer-ui { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 100px;
            display: flex; justify-content: center; gap: 40px; align-items: center; z-index: 2000;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            pointer-events: none;
        }
        .collection-btn { 
            pointer-events: auto; width: 70px; height: 70px; background: rgba(255,255,255,0.08); 
            border-radius: 18px; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); transition: 0.2s; position: relative;
        }
        .btn-unknown { box-shadow: 0 0 12px var(--neon-red); }
        .btn-known { box-shadow: 0 0 12px var(--vegas-gold); }
        .btn-label { font-size: 10px; color: #fff; font-weight: bold; margin-top: 2px; }
        .badge { position: absolute; top: -6px; right: -6px; background: #fff; color: #000; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; }

        .exit-btn { position: absolute; top: 15px; left: 15px; z-index: 2500; padding: 6px 12px; border-radius: 10px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #444; font-size: 12px; }
    </style>
</head>
<body>

    <header>WORD QUEST</header>

    <div class="vegas-sign">
        <div class="bulbs-row bulbs-top" id="bulbs-t"></div>
        <div class="vegas-label">ALL MASTERED</div>
        <div class="vegas-number" id="total-known-count">000</div>
        <div class="vegas-label">WORDS</div>
        <div class="bulbs-row bulbs-bottom" id="bulbs-b"></div>
    </div>

    <div id="menu-screen">
        <div id="level-preview" onclick="enterSelectedLevel()">
            <div style="font-size: 40px;" id="pre-emoji">🧒</div>
            <div id="pre-name" style="font-weight:900; color:#333; margin:2px 0;">JACKPOT!</div>
            <div id="pre-progress" style="font-family:'Orbitron'; color:var(--neon-green);">0/0</div>
            <div style="color:var(--neon-red); font-size:10px; margin-top:5px; font-weight:bold;">TAP TO PLAY</div>
        </div>
        <div class="wheel-section">
            <div class="wheel-container">
                <canvas id="wheel"></canvas>
            </div>
            <div class="spin-btn" onclick="spinWheel()">SPIN</div>
        </div>
    </div>

    <div id="game-screen">
        <button class="exit-btn" onclick="exitGame()">🏠 EXIT</button>
        <div id="card-container"></div>
        <div id="footer-ui">
            <div class="collection-btn btn-unknown" onclick="startReview('unknown')">
                <span style="font-size:24px;">🎒</span>
                <div class="btn-label">温故</div>
                <div class="badge" id="count-unknown">0</div>
            </div>
            <div class="collection-btn btn-known" onclick="startReview('known')">
                <span style="font-size:24px;">⭐</span>
                <div class="btn-label">知新</div>
                <div class="badge" id="count-known">0</div>
            </div>
        </div>
    </div>

    <script>
        let levelKeys = Object.keys(DB);
        let currentRotation = 0, isSpinning = false, selectedLevelId = null;
        let levelData = [], currentIndex = 0, listUnknown = [], listKnown = [], currentLevelId = null;
        let reviewModeType = null;

        function createBulbs() {
            const t = document.getElementById('bulbs-t'), b = document.getElementById('bulbs-b');
            for(let i=0; i<8; i++) { t.innerHTML += '<div class="bulb"></div>'; b.innerHTML += '<div class="bulb"></div>'; }
        }
        createBulbs();

        function updateGlobalTotal() {
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('progress_')) {
                    const data = JSON.parse(localStorage.getItem(key));
                    if (data?.known) total += data.known.length;
                }
            }
            document.getElementById('total-known-count').innerText = total.toString().padStart(3, '0');
        }

        function drawWheel() {
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const size = 800; canvas.width = size; canvas.height = size;
            const arc = (2 * Math.PI) / levelKeys.length;
            ctx.translate(size/2, size/2);
            levelKeys.forEach((key, i) => {
                const angle = i * arc - Math.PI/2;
                ctx.beginPath(); ctx.fillStyle = i % 2 === 0 ? "#1a1a1a" : "#262626";
                ctx.moveTo(0, 0); ctx.arc(0, 0, size/2, angle, angle + arc); ctx.fill();
                ctx.save(); ctx.rotate(angle + arc/2);
                ctx.font = "80px Apple Color Emoji"; ctx.textAlign = "center";
                ctx.fillText(DB[key].levelEmoji, size/2 * 0.7, 25); ctx.restore();
            });
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('level-preview').classList.remove('show');
            currentRotation += 1800 + Math.floor(Math.random() * 360);
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;
            setTimeout(() => {
                isSpinning = false;
                const deg = (360 - (currentRotation % 360)) % 360;
                selectedLevelId = levelKeys[Math.floor(deg / (360/levelKeys.length)) % levelKeys.length];
                showPreview(selectedLevelId);
            }, 4000);
        }

        function showPreview(id) {
            if(!id) return;
            const level = DB[id];
            const prog = JSON.parse(localStorage.getItem(`progress_${id}`)) || {known: []};
            const totalWords = Object.keys(level.words).length;
            const knownCount = prog.known ? prog.known.length : 0;
            
            document.getElementById('pre-emoji').innerText = level.levelEmoji;
            document.getElementById('pre-name').innerText = level.levelName.split(': ')[1];
            document.getElementById('pre-progress').innerText = `${knownCount}/${totalWords}`;
            document.getElementById('level-preview').classList.add('show');
        }

        function exitGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
            updateGlobalTotal();
            if (currentLevelId) showPreview(currentLevelId);
        }

        function startGame(id) {
            currentLevelId = id; reviewModeType = null;
            const saved = JSON.parse(localStorage.getItem(`progress_${id}`)) || {index:0, unknown:[], known:[]};
            const wordsObj = DB[id].words;
            levelData = Object.keys(wordsObj).map(key => ({ en: key, emoji: wordsObj[key][0], cn: wordsObj[key][1], py: wordsObj[key][4] }));
            currentIndex = saved.index; listUnknown = saved.unknown; listKnown = saved.known;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            renderNextCard(); updateCounters();
        }

        function startReview(type) {
            const list = (type === 'unknown') ? listUnknown : listKnown;
            if (list.length === 0) return;
            reviewModeType = type; levelData = [...list]; currentIndex = 0;
            renderNextCard();
        }

        function renderNextCard() {
            const container = document.getElementById('card-container');
            container.innerHTML = '';
            if (currentIndex >= levelData.length) { 
                container.innerHTML = `<div style="color:white; font-size:24px; font-family:Monoton;">FINISHED! 🏆</div>`;
                return; 
            }
            const word = levelData[currentIndex];
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.innerHTML = `
                <div class="card-face card-front"><div style="font-size:45px; font-family:'Fredoka One'; color:#333;">${word.en}</div></div>
                <div class="card-face card-back"><div style="font-size:75px;">${word.emoji}</div><div style="font-size:32px; font-weight:900; color:#333; margin:10px 0;">${word.cn}</div><div style="color:#888;">${word.py}</div></div>`;
            container.appendChild(wrapper);
            speak(word.en, 'en-US');
            wrapper.onclick = function() { if (this.dataset.dragging !== 'true') this.classList.toggle('is-flipped'); };
            initSwipe(wrapper, word);
        }

        function initSwipe(el, word) {
            let startX = 0, currentX = 0, startTime = 0;
            const onStart = (e) => {
                startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
                startTime = Date.now(); el.dataset.dragging = 'false'; el.style.transition = 'none';
            };
            const onMove = (e) => {
                if (startTime === 0) return;
                let x = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
                currentX = x - startX;
                if (Math.abs(currentX) > 10) {
                    el.dataset.dragging = 'true';
                    let rotY = el.classList.contains('is-flipped') ? 180 : 0;
                    el.style.transform = `translateX(${currentX}px) rotateY(${rotY}deg) rotateZ(${currentX * 0.05}deg)`;
                }
            };
            const onEnd = () => {
                if (startTime === 0) return;
                el.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                if (currentX > 110) swipeAction('known', word);
                else if (currentX < -110) swipeAction('unknown', word);
                else { let rotY = el.classList.contains('is-flipped') ? 180 : 0; el.style.transform = `rotateY(${rotY}deg)`; }
                setTimeout(() => { el.dataset.dragging = 'false'; }, 50);
                startTime = 0; currentX = 0;
            };
            el.addEventListener('mousedown', onStart); el.addEventListener('touchstart', onStart, {passive:false});
            window.addEventListener('mousemove', onMove); window.addEventListener('touchmove', onMove, {passive:false});
            window.addEventListener('mouseup', onEnd); window.addEventListener('touchend', onEnd);
        }

        function swipeAction(type, word) {
            if (reviewModeType === 'unknown' && type === 'known') {
                listUnknown = listUnknown.filter(w => w.en !== word.en);
                if(!listKnown.some(w => w.en === word.en)) listKnown.push(word);
                currentIndex++;
            } else if (reviewModeType === 'known' && type === 'unknown') {
                listKnown = listKnown.filter(w => w.en !== word.en);
                if(!listUnknown.some(w => w.en === word.en)) listUnknown.push(word);
                currentIndex++;
            } else if (reviewModeType === null) {
                if (type === 'known') {
                    if(!listKnown.some(w => w.en === word.en)) listKnown.push(word);
                    listUnknown = listUnknown.filter(w => w.en !== word.en);
                } else {
                    if(!listUnknown.some(w => w.en === word.en)) listUnknown.push(word);
                }
                currentIndex++;
            } else {
                currentIndex++;
            }

            const currentProg = JSON.parse(localStorage.getItem(`progress_${currentLevelId}`)) || {};
            const finalIndex = (reviewModeType === null) ? currentIndex : (currentProg.index || 0);
            localStorage.setItem(`progress_${currentLevelId}`, JSON.stringify({ index: finalIndex, unknown: listUnknown, known: listKnown }));
            
            updateCounters();
            setTimeout(renderNextCard, 200);
        }

        function updateCounters() {
            document.getElementById('count-unknown').innerText = listUnknown.length;
            document.getElementById('count-known').innerText = listKnown.length;
        }

        function enterSelectedLevel() { if (selectedLevelId) startGame(selectedLevelId); }
        function speak(t, l) { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = l; window.speechSynthesis.speak(m); }
        window.onload = () => { drawWheel(); updateGlobalTotal(); };
    </script>
</body>
</html>
