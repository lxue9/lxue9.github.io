<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单词大冒险 - 红外霓虹版</title>
    <script src="../../vocabulary.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a12;
            --vegas-gold: #ffcc00;
            --neon-red: #ff003c; /* 强烈的红外霓虹感 */
            --neon-green: #2ecc71;
            --bulb-off: #443300;
            --metal-gloss: linear-gradient(135deg, #333 0%, #000 50%, #222 100%);
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at center, #1e1e30 0%, var(--bg-dark) 100%);
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        header {
            text-align: center; padding: 15px 0 5px 0; color: white;
            text-shadow: 0 0 10px var(--neon-red), 0 0 20px var(--neon-red);
            font-family: 'Monoton', cursive; font-size: 34px; letter-spacing: 4px;
        }

        /* --- 经典点阵灯牌 (已回退) --- */
        .vegas-sign {
            align-self: center; background: #111; padding: 15px 40px; border-radius: 10px;
            border: 4px solid #333; position: relative;
            box-shadow: 0 0 0 4px #222, 0 0 20px rgba(255, 204, 0, 0.3), 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 25px; display: flex; flex-direction: column; align-items: center;
        }
        .bulbs-row { position: absolute; display: flex; justify-content: space-between; width: calc(100% - 10px); }
        .bulbs-top { top: 4px; }
        .bulbs-bottom { bottom: 4px; }
        .bulb { width: 8px; height: 8px; background: var(--bulb-off); border-radius: 50%; transition: all 0.2s; }
        .bulb:nth-child(odd) { animation: flash-1 0.6s infinite alternate; }
        .bulb:nth-child(even) { animation: flash-2 0.6s infinite alternate-reverse; }
        @keyframes flash-1 { from { background: var(--bulb-off); } to { background: #fff; box-shadow: 0 0 8px #fff, 0 0 15px var(--vegas-gold); } }
        @keyframes flash-2 { from { background: #fff; box-shadow: 0 0 8px #fff, 0 0 15px var(--vegas-gold); } to { background: var(--bulb-off); } }
        
        .vegas-label { color: var(--vegas-gold); font-family: 'Fredoka One'; font-size: 13px; letter-spacing: 2px; margin-bottom: 5px; opacity: 0.9; }
        .vegas-number {
            color: #fff; font-family: 'Orbitron', sans-serif; font-size: 40px; letter-spacing: 2px;
            text-shadow: 0 0 5px #fff, 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
            display: flex; align-items: baseline;
        }

        /* --- 优化：金属+霓虹转盘 --- */
        #menu-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        .wheel-section { 
            position: relative; width: 400px; height: 400px; max-width: 92vw;
            background: var(--metal-gloss); /* 金属感外壳 */
            padding: 10px; border-radius: 50%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.2);
        }

        .wheel-container { 
            width: 100%; height: 100%; border: 8px solid #111; border-radius: 50%; 
            background: #000; overflow: hidden; position: relative; 
            box-shadow: inset 0 0 20px #000;
        }

        #wheel { width: 100%; height: 100%; transition: transform 4s cubic-bezier(0.1, 0, 0.1, 1); }

        /* 红外霓虹射灯按钮 */
        .spin-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 85px; height: 85px; background: #111; border-radius: 50%; 
            border: 3px solid var(--neon-red); z-index: 40; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 28px; font-weight: 900; color: #fff; cursor: pointer;
            font-family: 'Fredoka One';
            /* 模拟强烈红外射灯效果 */
            box-shadow: 
                0 0 15px var(--neon-red), 
                0 0 30px var(--neon-red),
                inset 0 0 12px var(--neon-red);
            text-shadow: 0 0 10px #fff;
            animation: infrared-glow 1.5s infinite;
        }
        @keyframes infrared-glow {
            0% { box-shadow: 0 0 15px var(--neon-red), 0 0 30px var(--neon-red), inset 0 0 12px var(--neon-red); transform: translate(-50%, -50%) scale(1); }
            50% { box-shadow: 0 0 25px var(--neon-red), 0 0 50px var(--neon-red), inset 0 0 20px var(--neon-red); transform: translate(-50%, -50%) scale(1.05); }
            100% { box-shadow: 0 0 15px var(--neon-red), 0 0 30px var(--neon-red), inset 0 0 12px var(--neon-red); transform: translate(-50%, -50%) scale(1); }
        }

        .pointer { 
            position: absolute; top: -20px; left: 50%; transform: translateX(-50%); 
            width: 40px; height: 50px; background: #fff; 
            clip-path: polygon(50% 100%, 0 0, 100% 0); z-index: 30; 
            filter: drop-shadow(0 0 10px var(--neon-red));
        }

        /* 预览卡片 (Jackpot 风格) */
        #level-preview { 
            position: absolute; top: -30px; width: 280px; background: white; 
            border: 6px solid var(--vegas-gold); border-radius: 25px; padding: 15px; 
            text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); 
            opacity: 0; transform: scale(0.5); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: none; z-index: 100; 
        }
        #level-preview.show { opacity: 1; transform: scale(1) translateY(-20px); pointer-events: auto; }

        /* 游戏界面 */
        #game-screen { display: none; flex: 1; position: relative; width: 100%; background: #f4f4f4; }
        .back-btn { position: absolute; top: 15px; left: 15px; z-index: 110; background: #333; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; }
        #card-container { position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 380px; height: 60%; perspective: 1200px; }
        .card-wrapper { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s; }
        .card-face { position: absolute; width: 100%; height: 100%; background: white; border-radius: 30px; border: 6px solid #333; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; box-shadow: 0 10px 0 #ddd; }
        .card-front .word-text { font-size: 52px; font-family: 'Fredoka One'; color: #333; }
        .card-back { transform: rotateY(180deg); }
        #footer-ui { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 45px; }
        .collection-btn { width: 80px; height: 80px; background: white; border: 5px solid #333; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .badge { position: absolute; top: -12px; right: -12px; background: var(--neon-red); color: white; min-width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; border: 3px solid white; font-weight: 900; }
    </style>
</head>
<body>

    <header>WORD QUEST</header>

    <div class="vegas-sign">
        <div class="bulbs-row bulbs-top" id="bulbs-t"></div>
        <div class="vegas-label">ALL MASTERED</div>
        <div class="vegas-number">
            <span id="total-known-count">000</span>
            <span class="vegas-unit" style="font-size: 16px; margin-left: 8px; color: #fff; opacity: 0.5; font-family: 'Fredoka One';">WORDS</span>
        </div>
        <div class="bulbs-row bulbs-bottom" id="bulbs-b"></div>
    </div>

    <div id="menu-screen">
        <div id="level-preview" onclick="enterSelectedLevel()">
            <div style="font-size: 50px; margin-bottom: 5px;" id="pre-emoji">🧒</div>
            <div style="font-size: 22px; font-weight: 900; color: #333;" id="pre-name">JACKPOT!</div>
            <div style="font-size: 18px; color: #666; font-family: 'Orbitron';" id="pre-progress">0/100</div>
            <div style="font-size: 14px; color: var(--neon-red); font-weight: 900; margin-top: 10px; letter-spacing: 1px;">TAP TO START</div>
        </div>

        <div class="wheel-section">
            <div class="pointer"></div>
            <div class="wheel-container">
                <canvas id="wheel"></canvas>
            </div>
            <div class="spin-btn" onclick="spinWheel()">SPIN</div>
        </div>
    </div>

    <div id="game-screen">
        <button class="back-btn" onclick="exitGame()">🏠 EXIT</button>
        <div id="card-container"></div>
        <div id="footer-ui">
            <div class="collection-btn" onclick="startReview('unknown')"><span>🎒</span><div class="badge" id="count-unknown">0</div></div>
            <div class="collection-btn" onclick="startReview('known')"><span>⭐</span><div class="badge" id="count-known">0</div></div>
        </div>
    </div>

    <script>
        // 生成灯泡
        function createBulbs() {
            const topRow = document.getElementById('bulbs-t');
            const botRow = document.getElementById('bulbs-b');
            for(let i=0; i<10; i++) {
                topRow.innerHTML += '<div class="bulb"></div>';
                botRow.innerHTML += '<div class="bulb"></div>';
            }
        }
        createBulbs();

        let levelKeys = Object.keys(DB);
        let currentRotation = 0, isSpinning = false, selectedLevelId = null;

        function updateGlobalTotal() {
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('progress_')) {
                    const data = JSON.parse(localStorage.getItem(key));
                    if (data && data.known) total += data.known.length;
                }
            }
            document.getElementById('total-known-count').innerText = total.toString().padStart(3, '0');
        }

        // 优化转盘：金属配色+黄金边框
        function drawWheel() {
            const canvas = document.getElementById('wheel');
            const ctx = canvas.getContext('2d');
            const size = 400; canvas.width = size; canvas.height = size;
            const num = levelKeys.length;
            const arc = (2 * Math.PI) / num;
            
            // 深色系金属扇区配色
            const metalColors = ["#1a1a1a", "#262626", "#0f0f0f", "#333333", "#111111"];
            
            ctx.translate(size/2, size/2);
            levelKeys.forEach((key, i) => {
                const angle = i * arc - Math.PI/2;
                
                // 绘制扇区
                ctx.beginPath();
                ctx.fillStyle = metalColors[i % metalColors.length];
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, size/2, angle, angle + arc);
                ctx.fill();
                
                // 绘制分割金线
                ctx.strokeStyle = "rgba(255, 204, 0, 0.4)";
                ctx.lineWidth = 2;
                ctx.stroke();

                // 绘制 Emoji
                ctx.save();
                ctx.rotate(angle + arc/2);
                ctx.font = "42px Apple Color Emoji, Segoe UI Emoji";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowColor = "rgba(0,0,0,0.8)";
                ctx.shadowBlur = 10;
                ctx.fillText(DB[key].levelEmoji, size/2 * 0.72, 0);
                ctx.restore();
            });
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('level-preview').classList.remove('show');
            const rand = 1800 + Math.floor(Math.random() * 360);
            currentRotation += rand;
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;
            setTimeout(() => {
                isSpinning = false;
                const deg = (360 - (currentRotation % 360)) % 360;
                const idx = Math.floor(deg / (360 / levelKeys.length)) % levelKeys.length;
                selectedLevelId = levelKeys[idx];
                showPreview(selectedLevelId);
            }, 4000);
        }

        function showPreview(id) {
            const level = DB[id];
            const prog = JSON.parse(localStorage.getItem(`progress_${id}`)) || {index: 0};
            document.getElementById('pre-emoji').innerText = level.levelEmoji;
            document.getElementById('pre-name').innerText = level.levelName.split(': ')[1];
            document.getElementById('pre-progress').innerText = `${prog.index} / ${Object.keys(level.words).length}`;
            document.getElementById('level-preview').classList.add('show');
        }

        // --- 游戏核心逻辑 (保持不变) ---
        let levelData = [], currentIndex = 0, listUnknown = [], listKnown = [];
        let currentLevelId = null, isFlipped = false;
        let isReviewMode = false, reviewQueue = [], currentReviewType = null;

        function enterSelectedLevel() { if (selectedLevelId) startGame(selectedLevelId); }

        function startGame(id) {
            currentLevelId = id; isReviewMode = false;
            const wordsObj = DB[id].words;
            levelData = Object.keys(wordsObj).map(key => ({
                en: key, emoji: wordsObj[key][0], cn: wordsObj[key][1],
                mnemonic: wordsObj[key][2], exEn: wordsObj[key][3], py: wordsObj[key][4], exCn: wordsObj[key][5]
            }));
            const saved = JSON.parse(localStorage.getItem(`progress_${id}`)) || {index:0, unknown:[], known:[]};
            currentIndex = saved.index; listUnknown = saved.unknown; listKnown = saved.known;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            updateCounters(); renderNextCard();
        }

        function renderNextCard() {
            const container = document.getElementById('card-container');
            container.innerHTML = ''; isFlipped = false;
            let word;
            if (isReviewMode) {
                if (reviewQueue.length === 0) { isReviewMode = false; renderNextCard(); return; }
                word = reviewQueue.shift();
            } else {
                if (currentIndex >= levelData.length) {
                    container.innerHTML = `<div class="card-face card-front" style="font-size:20px; text-align:center;">🏆 YOU WIN!</div>`;
                    return;
                }
                word = levelData[currentIndex];
            }
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.innerHTML = `<div class="card-face card-front"><div class="word-text">${word.en}</div></div><div class="card-face card-back"><div style="font-size:60px">${word.emoji}</div><div style="font-size:32px; font-weight:900">${word.cn}</div><div style="color:#666">${word.py}</div><div style="background:#f0f7ff; padding:10px; border-radius:10px; font-size:14px">💡 ${word.mnemonic}</div></div>`;
            container.appendChild(wrapper);
            speak(word.en, 'en-US');
            bindSwipeEvents(wrapper, word);
        }

        function bindSwipeEvents(el, word) {
            let startX = 0, currentX = 0, startTime = 0, dragging = false;
            const onStart = (e) => { dragging = true; startX = e.pageX || e.touches[0].pageX; startTime = Date.now(); };
            const onMove = (e) => {
                if (!dragging) return;
                currentX = (e.pageX || e.touches[0].pageX) - startX;
                el.style.transform = `translateX(${currentX}px) rotateY(${isFlipped ? 180 : 0}deg) rotateZ(${currentX * 0.08}deg)`;
            };
            const onEnd = () => {
                if (!dragging) return; dragging = false;
                if (Math.abs(currentX) < 15 && (Date.now() - startTime) < 250) {
                    isFlipped = !isFlipped; el.classList.toggle('flipped');
                    isFlipped ? speak(word.cn, 'zh-CN') : speak(word.en, 'en-US');
                    el.style.transform = isFlipped ? `rotateY(180deg)` : `rotateY(0deg)`;
                } else if (currentX > 110) { handleSwipeResult(el, 'known', word); }
                else if (currentX < -110) { handleSwipeResult(el, 'unknown', word); }
                else { el.style.transform = isFlipped ? `rotateY(180deg)` : `rotateY(0deg)`; }
                currentX = 0;
            };
            el.addEventListener('touchstart', onStart, {passive: true}); window.addEventListener('touchmove', onMove, {passive: true}); window.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart); window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onEnd);
        }

        function handleSwipeResult(el, type, word) {
            el.style.transition = 'transform 0.4s ease-in, opacity 0.4s';
            el.style.transform = `translateX(${type === 'known' ? 800 : -800}px) opacity(0)`;
            if (!isReviewMode) {
                if (type === 'known') {
                    if (!listKnown.find(i => i.en === word.en)) listKnown.push(word);
                    listUnknown = listUnknown.filter(i => i.en !== word.en);
                } else {
                    if (!listUnknown.find(i => i.en === word.en)) listUnknown.push(word);
                    listKnown = listKnown.filter(i => i.en !== word.en);
                }
                currentIndex++;
            }
            localStorage.setItem(`progress_${currentLevelId}`, JSON.stringify({ index: currentIndex, unknown: listUnknown, known: listKnown }));
            setTimeout(() => { updateCounters(); renderNextCard(); updateGlobalTotal(); }, 300);
        }

        function startReview(type) { currentReviewType = type; reviewQueue = type === 'unknown' ? [...listUnknown] : [...listKnown]; if (!reviewQueue.length) return; isReviewMode = true; renderNextCard(); }
        function updateCounters() { document.getElementById('count-unknown').innerText = listUnknown.length; document.getElementById('count-known').innerText = listKnown.length; }
        function speak(t, l) { window.speechSynthesis.cancel(); const m = new SpeechSynthesisUtterance(t); m.lang = l; window.speechSynthesis.speak(m); }
        function exitGame() { document.getElementById('game-screen').style.display = 'none'; document.getElementById('menu-screen').style.display = 'flex'; updateGlobalTotal(); if(selectedLevelId) showPreview(selectedLevelId); }
        
        window.onload = () => { drawWheel(); updateGlobalTotal(); };
    </script>
</body>
</html>
